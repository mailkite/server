# fail2ban filter for the MailKite IMAP daemon (imap/server.js). Matches the ISO-timestamped
# auth-failure lines the daemon appends to its auth-fail.log:
#   2026-07-01T09:24:00.000Z imap auth failed user=<u> ip=<ip>
# fail2ban auto-detects the leading ISO8601 timestamp. Install to
# /etc/fail2ban/filter.d/mailkite-imap.conf on the VPS. See docs/architecture/imap-access.md.
[Definition]
failregex = imap auth failed user=\S+ ip=<HOST>
ignoreregex =
