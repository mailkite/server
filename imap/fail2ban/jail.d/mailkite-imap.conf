# fail2ban jail for the MailKite IMAP daemon. Tails the daemon's auth-fail.log (file-based — more
# robust than fail2ban's systemd-journal reader, which doesn't reliably match this unit on Ubuntu
# 24.04) and bans an IP that fails auth 10× in 15 min for 1 hour (network-layer complement to the
# Worker's app-layer lockout in /api/imap/auth). Adjust logpath to the deploy user's home if not
# `gabe`. Install to /etc/fail2ban/jail.d/mailkite-imap.conf on the VPS.
[mailkite-imap]
enabled  = true
backend  = auto
logpath  = /home/gabe/mailkite-imap/auth-fail.log
filter   = mailkite-imap
maxretry = 10
findtime = 900
bantime  = 3600
port     = 993
protocol = tcp
