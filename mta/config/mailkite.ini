; Config for the mailkite_ingest plugin. Secrets are read from the environment first
; (MAILKITE_HMAC_SECRET) so they never land on disk in the image — this file only
; holds non-secret defaults. See README.

[main]
; Where to POST accepted mail (the Worker ingest seam).
ingest_url=https://api.mailkite.dev/api/ingest

; HMAC secret — DO NOT put the real value here. Set env MAILKITE_HMAC_SECRET
; (fly secrets set MAILKITE_HMAC_SECRET=...). Left blank intentionally.
hmac_secret=

; HTTP timeout for the ingest POST, milliseconds.
timeout_ms=10000

; --- mailkite_rcpt (live anti-open-relay RCPT check) -----------------------------
; Base URL of the Worker; the plugin appends /api/mx/accepted-domains. Prefer env
; MAILKITE_API_URL. The Bearer is MAILKITE_HMAC_SECRET (same as ingest; never on disk).
api_url=https://api.mailkite.dev
; Positive-cache TTL (ms): how long an accepted-domains snapshot is trusted before refresh.
accept_ttl_ms=30000
; Fetch timeout (ms) for the accepted-domains lookup.
accept_timeout_ms=5000

; --- mailkite_spam (inbound DNSBL signal) ----------------------------------------
; Docs: docs/architecture/inbound-spam.md §3. SIGNAL ONLY — this never rejects mail.
; Env wins over each value here (MAILKITE_DNSBL_ZONE / _RESOLVERS / _ENABLED).
[dnsbl]
; "0" disables the lookup entirely; every verdict then reads `unknown` (never `clean`).
enabled=1
; The IP blocklist zone. Swap to move to another operator — or to keyed Spamhaus DQS
; hostnames — without touching code or redeploying the Worker.
zone_ip=zen.spamhaus.org
; The DOMAIN blocklist zone, checked against the From header's domain. Separate list, separate
; return codes, separate canary — a broken DBL costs one signal, not both.
zone_domain=dbl.spamhaus.org
; Domain-zone canary. Spamhaus publishes dbltest.com as permanently listed.
canary_listed_domain=dbltest.com
; The resolver to query FROM. Blank = inherit /etc/resolv.conf. If that points at a PUBLIC
; resolver, Spamhaus refuses us and answers 127.255.255.254 for everything — which the
; canary below detects and reports, rather than letting it read as "clean" (the exact bug
; that silently broke the outbound lookups for weeks; see lib/dnsbl.js).
resolvers=
; Canary test points with known-opposite verdicts. If the listed one doesn't come back
; listed, or the clean one doesn't come back clean, our queries aren't being answered and
; every verdict is downgraded to `unknown`.
canary_listed_ip=127.0.0.2
canary_clean_ip=127.0.0.1
; Per-lookup DNS timeout (ms). Held inside the SMTP connect hook, so keep it short.
timeout_ms=2000
; How long a definitive verdict (and the canary result) is reused, in ms.
cache_ttl_ms=600000
