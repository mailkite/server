; Haraka SMTP listener for the MailKite MX edge.
; Listen on :25. On dual-stack Linux, binding [::]:25 ALSO accepts IPv4 — do NOT
; also list 0.0.0.0:25 or the second bind fails with EADDRINUSE and the worker
; crash-loops. This single binding covers both v6 and v4 (and Fly's IPv6 network).
listen=[::]:25

; One process is plenty for a dumb relay; bump `nodes` for more cores.
nodes=1

; Be polite about who we are in the SMTP banner (also set in config/me).
; daemon_name is the greeting hostname.
daemon_name=mx.mailkite.dev

[headers]
; We don't mutate or add Received/headers beyond Haraka defaults — the Worker parses.

[message]
; Hard cap on message size (bytes). Also enforced via config/databytes. 25 MB.
max_data_lines=100000
