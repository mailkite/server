; TLS for the MX edge. Haraka's core `tls` plugin loads the cert/key from
; config/tls/tls_cert.pem + config/tls/tls_key.pem (provisioned per-host via Let's Encrypt
; for mx1.mailkite.dev — never committed; see README §TLS and .gitignore).
;
; Inbound senders negotiate STARTTLS opportunistically. Without these certs the edge still
; accepts mail, but in the clear — which costs deliverability signals with the big
; receivers and blocks any future MTA-STS/DANE policy.

[main]
; The global server cert/key. Haraka's default looks for these at the CONFIG ROOT
; (config/tls_cert.pem); we keep them in the git-ignored config/tls/ subdir instead, so
; point at the subdir paths explicitly. (The config/tls/ *directory* loader pairs by CN
; and can't match a bare key file, so the global cert must be set this way.)
cert=tls/tls_cert.pem
key=tls/tls_key.pem
; Inbound senders don't present client certs, and opportunistic TLS (RFC 7435) must never
; let a verification failure block mail — ask for nothing, reject nothing.
requestCert=false
rejectUnauthorized=false
; Reasonable modern floor.
honorCipherOrder=true
