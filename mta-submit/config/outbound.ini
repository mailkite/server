; Outbound delivery settings for the HTTP inject path.
;
; These settings apply when outbound.send_email() is called by mailkite_http_inject.
; The HTTP inject path bypasses hook_queue plugins and delivers directly.

; Prefer IPv4 for outbound connections (many receiving MXes have better IPv4 deliverability).
inet_prefer=v4

; Queue directory — Haraka stores outbound messages here before delivery.
; Default is fine (Haraka manages this automatically).
; queue_dir=queue

; How often to retry a failed delivery (seconds). Default 30m.
; retry_interval=1800

; Max delivery attempts before giving up. Default 13.
; max_delivery_attempts=13
