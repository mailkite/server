; Connection-level settings — REQUIRED in a custom (`-c <dir>`) config dir.
;
; Haraka core reads cfg.max.line_length (_process_data), cfg.message.greeting
; (connect_respond), cfg.uuid.banner_chars, cfg.headers.*, etc. With a custom config
; dir it does NOT fall back to the core default connection.ini, so every section the
; core touches must exist here or the worker crashes on connect/EHLO/DATA
; (TypeError: Cannot read properties of undefined). Mirrors Haraka's own defaults with
; our banner. Keep all sections.

[main]

[haproxy]
hosts[] =

[headers]
max_lines=1000
max_received=100

[max]
bytes=26214400
mime_parts=1000
line_length=512
data_line_length=992

[message]
helo=MailKite submission at your service.
close=closing connection. Have a jolly good day.

[uuid]
banner_chars=6
deny_chars=0
