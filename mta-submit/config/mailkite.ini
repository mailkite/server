; Config for the submission-edge plugins (auth_mailkite, mailkite_relay, mailkite_http_inject).
; Secrets are read from the environment first (MAILKITE_HMAC_SECRET) so they never land
; on disk — this file only holds non-secret defaults. See README.

[main]
; Base URL of the Worker. The plugins append /api/smtp/auth and /api/relay. Prefer env
; MAILKITE_API_URL.
api_url=https://api.mailkite.dev

; Explicit relay endpoint (optional override; defaults to api_url + /api/relay).
; relay_url=https://api.mailkite.dev/api/relay

; HMAC secret — DO NOT put the real value here. Set env MAILKITE_HMAC_SECRET (it must equal
; the API Worker's INGEST_SECRET). It is the Bearer used to call /api/smtp/auth at SMTP AUTH
; time. Left blank intentionally.
hmac_secret=

; Timeouts (ms).
auth_timeout_ms=5000
relay_timeout_ms=15000

; Free-subdomain pool → DKIM identity mapping. THIS SECTION IS PER-BOX and is the only thing
; that used to differ between the mailn copy of this plugin and the (previously untracked)
; mailk fork. One file now serves both; the behaviour is chosen here.
;
;   mode=parent   every <sub>.<pool_base> signs as d=<pool_base>, using the one key at
;                 config/dkim/<pool_base>/. No per-sub DKIM DNS record needed. DMARC still
;                 aligns (relaxed). Pool-wide reputation is shared.        
;   mode=per_sub  <sub>.<pool_base> signs as d=<sub>.<pool_base> using the SHARED key at
;                 config/dkim/<pool_base>/, published per-sub at
;                 <selector>._domainkey.<sub>. Each sub carries its own reputation, so one
;                 abusive sub can't burn the whole pool.                   
;   mode=none     no pool mapping — sign d=<From domain> from its own key dir. (default)
;
; Senders outside pool_base are always signed with their own domain + key dir, in every mode.
; A box with pool_base set but mode=none logs an error at startup, because pool mail would go
; out UNSIGNED (it would look for a per-sub key dir that doesn't exist).
;
; Verify what a box is actually running with:  curl -s http://<box>/health
[dkim]
pool_base=
mode=none

; HTTP inject endpoint — accepts RFC822 from the CF Worker and injects into Haraka's
; outbound queue. See docs/architecture/mailkite-provider.md.
[http_inject]
; Bind to all interfaces on PORT 80 — the CF Worker POSTs here, and Cloudflare
; Workers can only make subrequests on ports 80/443 (no custom ports like 8080).
; node carries cap_net_bind_service so it can bind :80 as the non-root service user.
; Access is gated by HMAC (constant-time verify + 300s timestamp replay
; protection) in mailkite_http_inject.js; only POST /send and POST /rbl (both
; HMAC-signed) and GET /health are accepted. Follow-up: restrict :80 to
; Cloudflare egress IPs via iptables for defense-in-depth.
listen=0.0.0.0
port=80
timeout_ms=5000

; DNSBL lookups performed on the Worker's behalf (POST /rbl). Workers have no raw DNS and
; Spamhaus REFUSES public resolvers (every query via cloudflare-dns.com returned
; 127.255.255.254, which the old Worker code read as "not listed"), so the query has to
; happen from a resolver we control. See docs/architecture/anti-spam.md §3.
[rbl]
; The resolver to query FROM. Blank = inherit /etc/resolv.conf. If that points at a public
; resolver we get refused exactly as before — install a local unbound and set 127.0.0.1.
; Either way the canary below reports which situation we're actually in.
resolvers=
; Zones. Swap these to move to another list operator without touching code.
zone_ip=zen.spamhaus.org
zone_domain=dbl.spamhaus.org
; Canary test points with known-opposite verdicts. If the listed one doesn't come back
; listed, or the clean one doesn't come back clean, our queries aren't being answered and
; every verdict in the response is downgraded to `unknown`. Blank canary_listed_domain
; skips the domain-zone probe (for operators without a documented test point).
canary_listed_ip=127.0.0.2
canary_clean_ip=127.0.0.1
; Spamhaus's DOCUMENTED dbl test point. NOT `dbl.spamhaus.org` — that returns NXDOMAIN, which
; would fail the canary permanently and collapse every verdict to unknown.
canary_listed_domain=dbltest.com
timeout_ms=2000
max_targets=24
concurrency=8
