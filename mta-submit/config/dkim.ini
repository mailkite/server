; DKIM signing config for the outbound delivery path.
;
; Signs outbound messages with per-domain DKIM keys. The private keys are stored in
; config/dkim/ (one per domain, named <selector>.<domain>.key). The platform publishes
; the public keys via DNS TXT records at haraka._domainkey.<domain>.
;
; Selector: "haraka" — matches the DNS record name (haraka._domainkey.<domain>).
; Key directory: config/dkim/ — one .pem file per domain.

[sign]
selector=haraka
domain_key_dir=config/dkim
; Sign all outbound messages (both HTTP inject and SMTP relay paths).
; For the HTTP inject path, outbound.send_email() triggers dkim_sign automatically.
; For the SMTP relay path, mailkite_relay bypasses outbound — but those messages
; are relayed to the Worker, which uses its own provider's DKIM (CF/SES/etc.).
disabled=false
