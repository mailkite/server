; Haraka SMTP listener for the MailKite *submission* edge (outbound relay).
; Distinct instance from the :25 MX edge (mta/) — different trust model: this one
; REQUIRES AUTH over TLS and relays for authenticated users; it never accepts inbound.
;
; Submission ports:
;   587 — STARTTLS submission (RFC 6409). AUTH offered only after STARTTLS.
;   465 — implicit TLS (SMTPS). Haraka starts TLS at connect for its smtps_port (465).
; On dual-stack Linux, binding [::] also accepts IPv4 — do NOT also list 0.0.0.0 or the
; second bind fails with EADDRINUSE and the worker crash-loops.
listen=[::]:587,[::]:465

; One process is plenty for a relay; bump `nodes` for more cores.
nodes=1

; SMTP banner / greeting hostname (also config/me). Must match the VPS PTR
; (mx1.mailkite.dev) for clean FCrDNS on outbound HELO.
daemon_name=mx1.mailkite.dev

[headers]
; We don't mutate headers — the Worker parses the raw MIME and rebuilds the outbound message.

[message]
; Hard cap on message size (bytes). Also enforced via config/databytes. 25 MB.
max_data_lines=100000
