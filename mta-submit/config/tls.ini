; TLS for the submission edge. Haraka's core `tls` plugin loads the cert/key from
; config/tls/tls_cert.pem + config/tls/tls_key.pem (provisioned per-host via Let's Encrypt
; for smtp.mailkite.dev — never committed; see README §TLS and .gitignore).
;
; AUTH is offered only on encrypted sessions, so without these certs the edge accepts a
; connection but never advertises AUTH (and 465 implicit-TLS connects fail outright).

[main]
; The global server cert/key. Haraka's default looks for these at the CONFIG ROOT
; (config/tls_cert.pem); we keep them in the git-ignored config/tls/ subdir instead, so
; point at the subdir paths explicitly. This sets the cert used for STARTTLS (587) AND
; implicit TLS (465). (The config/tls/ *directory* loader pairs by CN and can't match a
; bare key file, so the global cert must be set this way.)
cert=tls/tls_cert.pem
key=tls/tls_key.pem
; Ask for but don't require a client cert (submission clients authenticate with AUTH, not certs).
requestCert=false
rejectUnauthorized=false
; Reasonable modern floor.
honorCipherOrder=true
